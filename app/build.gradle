plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.gms.google-services'
}

// Machine-local settings and secrets (local.properties is never committed).
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.stickers.bank'
    compileSdk 37

    defaultConfig {
        applicationId "com.stickers.bank"
        minSdk 24
        targetSdk 37
        versionCode 30
        versionName "7.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }

        // AdMob App ID (AndroidManifest's APPLICATION_ID meta-data). Debug builds use Google's
        // public test app — paired with the test ad unit in ads/Ads.kt.
        manifestPlaceholders = [admobAppId: "ca-app-pub-1281325310603643~2660946725"]

        // Cloudflare R2 keys for the in-app admin uploader — from local.properties, so they
        // stay out of git. Missing keys just leave the admin upload switched off (R2Config).
        buildConfigField "String", "R2_ACCESS_KEY_ID", "\"${localProps.getProperty('r2.accessKeyId', '')}\""
        buildConfigField "String", "R2_SECRET_ACCESS_KEY", "\"${localProps.getProperty('r2.secretAccessKey', '')}\""
    }

    buildTypes {
        release {
            // The real AdMob App ID — paired with the real interstitial unit in ads/Ads.kt.
            manifestPlaceholders = [admobAppId: "ca-app-pub-1281325310603643~2660946725"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    // Keep the 161MB reference sticker library (assets/sticker_img) out of the
    // packaged APK. Only the curated assets/catalog set ships for test mode.
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!sticker_img'
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-video:2.7.0'
    // Animated WebP / GIF playback (ImageDecoderDecoder on API 28+, GifDecoder below).
    implementation 'io.coil-kt:coil-gif:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    // Firebase (catalog database)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // AdMob interstitials
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // "Remove background" in the crop step: Google's on-device person segmentation. The model
    // ships inside the app — it runs offline, needs no account, key or internet, costs nothing.
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'

    // Cloudflare R2 uploads (S3-compatible)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
